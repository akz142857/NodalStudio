name: Windows x64 test package

on:
  push:
    branches: [main, 'codex/windows-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Windows frontend validation
        run: |
          node --test Scripts/tests/windows_bundle_hash.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          exit $LASTEXITCODE

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Windows Rust validation (including real Credential Manager)
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          exit $LASTEXITCODE
      - name: Restore release compilation cache
        id: release-cache
        uses: actions/cache/restore@v4
        with:
          path: target/x86_64-pc-windows-msvc/release
          key: windows-release-v1-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: windows-release-v1-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml') }}-
      - name: Build unsigned installer and checksum
        run: ./Scripts/build_windows_test.ps1
      - name: Save release compilation cache before lifecycle checks
        if: steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/x86_64-pc-windows-msvc/release
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
      - name: Install, launch WebView2, verify persistence and uninstall
        run: ./Scripts/test_windows_package.ps1
      - name: Upload test package and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nodal-Studio-windows-x64-unsigned-${{ github.sha }}
          path: dist/releases/windows-*-test/
          if-no-files-found: warn
          retention-days: 30
