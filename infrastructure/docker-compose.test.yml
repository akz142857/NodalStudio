services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nodalstudio_test
      POSTGRES_USER: nodalstudio
      POSTGRES_PASSWORD: nodalstudio
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodalstudio -d nodalstudio_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ../fixtures/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

