# Disposable, loopback-only services. Use a unique Compose project per run.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nodalstudio_test
      POSTGRES_USER: nodalstudio
      POSTGRES_PASSWORD: acceptance-fixture-only
    ports:
      - "127.0.0.1::5432"
    volumes:
      - ../fixtures/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodalstudio -d nodalstudio_test"]
      interval: 1s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nodalstudio_test
      MYSQL_USER: nodalstudio
      MYSQL_PASSWORD: acceptance-fixture-only
      MYSQL_ROOT_PASSWORD: acceptance-root-only
    ports:
      - "127.0.0.1::3306"
    volumes:
      - ../fixtures/mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      # Do not mark the socket-only initialization server healthy.
      test: ["CMD", "mysql", "--protocol=TCP", "--connect-timeout=2", "-h", "127.0.0.1", "-unodalstudio", "-pacceptance-fixture-only", "-D", "nodalstudio_test", "-e", "SELECT id FROM orders LIMIT 0"]
      interval: 2s
      timeout: 5s
      retries: 40
  cloud-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nodalstudio_cloud_test
      POSTGRES_USER: nodalstudio
      POSTGRES_PASSWORD: acceptance-fixture-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodalstudio -d nodalstudio_cloud_test"]
      interval: 1s
      timeout: 5s
      retries: 30
