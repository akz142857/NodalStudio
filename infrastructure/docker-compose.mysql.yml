services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nodalstudio_test
      MYSQL_USER: nodalstudio
      MYSQL_PASSWORD: nodalstudio
      MYSQL_ROOT_PASSWORD: root-only-for-fixture
    ports:
      - "53306:3306"
    healthcheck:
      # Initialization uses a socket-only temporary server. Require authenticated
      # TCP access to the fixture before allowing the adapter test to start.
      test: ["CMD", "mysql", "--protocol=TCP", "--connect-timeout=2", "-h", "127.0.0.1", "-unodalstudio", "-pnodalstudio", "-D", "nodalstudio_test", "-e", "SELECT id FROM orders LIMIT 0"]
      interval: 2s
      timeout: 5s
      retries: 40
    volumes:
      - ../fixtures/mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
