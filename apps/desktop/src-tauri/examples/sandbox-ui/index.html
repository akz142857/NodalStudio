<!doctype html><html lang="en"><meta charset="utf-8"><title>Sandbox compatibility</title><style>body{background:#171b22;color:#e5e7eb;font:16px system-ui;padding:30px}button{padding:12px;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Native App Sandbox compatibility</h1><p>Isolated fixture only. Uses production file access, Git workspace and SSH tunnel implementations. No purchase bypass is compiled into Nodal Studio.</p><button id="choose">Choose fixture folder</button><button id="run">Run saved fixture</button><pre id="result">Ready</pre><script>
const invoke=window.__TAURI__.core.invoke;
for(const [id,command] of [['choose','choose_fixture'],['run','run_fixture']])document.getElementById(id).onclick=async()=>{document.getElementById('run').disabled=true;document.getElementById('result').textContent='Running…';try{document.getElementById('result').textContent=JSON.stringify(await invoke(command),null,2)}catch(e){document.getElementById('result').textContent=String(e)}finally{document.getElementById('run').disabled=false}};
</script></html>
