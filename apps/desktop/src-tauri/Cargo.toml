[package]
name = "nodalstudio-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "nodalstudio_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
storekit-bridge = { path = "../../../crates/storekit-bridge", optional = true }
ai-context = { path = "../../../crates/ai-context" }
chrono.workspace = true
extension-model = { path = "../../../crates/extension-model" }
git-workspace = { path = "../../../crates/git-workspace" }
keyring.workspace = true
mysql-adapter = { path = "../../../crates/mysql-adapter" }
postgres-adapter = { path = "../../../crates/postgres-adapter" }
query-engine = { path = "../../../crates/query-engine" }
reqwest.workspace = true
schema-diff = { path = "../../../crates/schema-diff" }
schema-model = { path = "../../../crates/schema-model" }
semver.workspace = true
settings-model = { path = "../../../crates/settings-model" }
semantic-model = { path = "../../../crates/semantic-model" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
snapshot-store = { path = "../../../crates/snapshot-store" }
sqlx.workspace = true
tauri.workspace = true
tokio = { workspace = true, features = ["process"] }
tempfile = "3.27.0"
tokio-util.workspace = true
uuid.workspace = true
tauri-plugin-updater = "2"
flate2 = "1.1.9"
tar = "0.4.46"
plist = "1.10.0"
tauri-plugin-dialog = "2"
zip = { version = "4.6.1", default-features = false }

[lints]
workspace = true

[features]
mac-app-store = ["dep:storekit-bridge"]
# Only for isolated loopback upgrade acceptance builds. Never enable for distribution.
updater-smoke-test = []

[[example]]
name = "sandbox_compatibility"
test = false
required-features = ["mac-app-store"]
